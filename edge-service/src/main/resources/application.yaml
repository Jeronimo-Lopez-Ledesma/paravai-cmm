server:
  port: 9000

spring:
  application:
    name: edge-service

  session:
    store-type: redis
    timeout: 30m

  cloud:
    gateway:
      default-filters:
        - name: Retry
          args:
            retries: 3
            methods: GET
            series: SERVER_ERROR
            exceptions: java.io.IOException, java.util.concurrent.TimeoutException
            backoff:
              firstBackoff: 50ms
              maxBackOff: 500ms
              factor: 2
              basedOnPreviousValue: false

      routes:
        - id: community
          uri: lb://community
          predicates:
            - Path=/api/communities/**
          filters:
            - StripPrefix=1

        - id: membership
          uri: lb://membership
          predicates:
            - Path=/api/memberships/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway